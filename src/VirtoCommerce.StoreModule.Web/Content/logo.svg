<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Store">
  <title>Store</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="92%" y2="100%">
      <stop offset="0%" stop-color="#3FD8B4"/>
      <stop offset="100%" stop-color="#0E9E80"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#064F40" flood-opacity="0.30"/>
    </filter>
    <clipPath id="awn"><path d="M-44,-28 H44 V-16 a7.33,6 0 0 1 -14.66,0 a7.33,6 0 0 1 -14.66,0 a7.33,6 0 0 1 -14.66,0 a7.33,6 0 0 1 -14.66,0 a7.33,6 0 0 1 -14.66,0 a7.33,6 0 0 1 -14.66,0 Z"/></clipPath>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <g transform="translate(64,63)" filter="url(#lift)">
    <!-- Store body -->
    <rect x="-40" y="-14" width="80" height="50" rx="3" fill="#ffffff"/>
    <!-- Windows -->
    <rect x="-34" y="0" width="18" height="15" rx="2" fill="#3FD8B4"/>
    <rect x="16" y="0" width="18" height="15" rx="2" fill="#3FD8B4"/>
    <!-- Door -->
    <rect x="-10" y="6" width="20" height="30" rx="2" fill="#5FC8F5"/>

    <!-- Awning (striped, scalloped) -->
    <g clip-path="url(#awn)">
      <rect x="-44" y="-28" width="14.67" height="22" fill="#FF9A3D"/>
      <rect x="-29.33" y="-28" width="14.67" height="22" fill="#ffffff"/>
      <rect x="-14.66" y="-28" width="14.67" height="22" fill="#FF9A3D"/>
      <rect x="0" y="-28" width="14.67" height="22" fill="#ffffff"/>
      <rect x="14.67" y="-28" width="14.67" height="22" fill="#FF9A3D"/>
      <rect x="29.34" y="-28" width="14.67" height="22" fill="#ffffff"/>
    </g>
  </g>
</svg>
